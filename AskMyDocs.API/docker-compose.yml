services:
  api:
    build: .
    container_name: askmydocs-api
    ports:
      - "8080:8080"
    environment:
      Ollama__BaseUrl: "http://ollama:11434/"
      Qdrant__Host: "qdrant"
      Qdrant__Port: "6334"
      IndexApiKey: "dev-index-key"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  ollama:
    image: ollama/ollama
    container_name: askmydocs-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    container_name: askmydocs-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull qwen3:1.7b
        ollama pull nomic-embed-text
    volumes:
      - ollama-data:/root/.ollama

  qdrant:
    image: qdrant/qdrant
    container_name: askmydocs-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  ollama-data:
  qdrant-data: